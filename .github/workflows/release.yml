# Publish the workspace crates to crates.io when a version tag is pushed, then
# create the GitHub release with install notes, the source, a Linux binary and
# their SHA-256s.
# The crates.io token lives in the repository secret CARGO_DEPLOY_KEY.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev dbus
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The tag must name the version in [workspace.package], so v0.2.0 never
      # uploads 0.1.0 by mistake.
      - name: Check the tag matches the workspace version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "tidal-player") | .version')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Layering
        run: cargo xtask layering
      - name: Test
        run: cargo test --workspace
      # Built before publishing: a crates.io upload cannot be taken back, so a
      # build that fails here stops the release before anything goes out.
      - name: Build the release binary
        run: cargo build --release --locked -p tidal-player
      - name: Package the source and binary
        run: |
          name="tidal-player-${GITHUB_REF_NAME}"
          bin="${name}-x86_64-unknown-linux-gnu"
          mkdir -p dist "${bin}"
          git archive --format=zip --prefix="${name}/" -o "dist/${name}-src.zip" HEAD
          cp target/release/tidal-player README.md LICENSE-MIT LICENSE-APACHE "${bin}/"
          zip -r "dist/${bin}.zip" "${bin}"
          cd dist && sha256sum -- *.zip > SHA256SUMS
      # Publishes core, api, audio, then tidal-player, in dependency order.
      - name: Publish to crates.io
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_DEPLOY_KEY }}
      # The install instructions from .github/release-notes.md go above the
      # generated notes; only the listed variables are substituted.
      - name: Create the GitHub release
        run: |
          TAG="${GITHUB_REF_NAME}" VERSION="${GITHUB_REF_NAME#v}" \
            envsubst '${TAG} ${VERSION} ${GITHUB_REPOSITORY}' \
            < .github/release-notes.md > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
            --notes-file release-notes.md dist/*
        env:
          GH_TOKEN: ${{ github.token }}
