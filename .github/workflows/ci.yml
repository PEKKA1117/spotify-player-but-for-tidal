# Spec 0001 AC9: the "Build & tooling" checks on pushes and pull requests.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The jobs build and test code, so they run only where code changes: tags (the
# release waits for them), master, and feat/* and bugfix/* branches; docs/* and
# chore/* skip them. `head_ref` is the PR's branch; on a push it is empty and
# `ref_name` is the branch or tag.
jobs:
  check:
    if: ${{ github.ref_type == 'tag' || github.ref_name == 'master' || startsWith(github.head_ref || github.ref_name, 'feat/') || startsWith(github.head_ref || github.ref_name, 'bugfix/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # dbus: the MPRIS tests start their own dbus-daemon (spec 0010).
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev dbus
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Layering
        run: cargo xtask layering
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  # AC7: the audio crate must build and test without the ALSA headers.
  audio-no-alsa:
    if: ${{ github.ref_type == 'tag' || github.ref_name == 'master' || startsWith(github.head_ref || github.ref_name, 'feat/') || startsWith(github.head_ref || github.ref_name, 'bugfix/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Make sure the ALSA headers are absent
        run: |
          sudo apt-get remove -y libasound2-dev || true
          if pkg-config --exists alsa; then echo "alsa.pc still present" >&2; exit 1; fi
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test audio without the alsa feature
        run: cargo test -p tidal-player-audio --no-default-features
