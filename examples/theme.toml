# tidal-player's theme.toml (spec 0017): spotify-player's format, so its
# theme.toml can be copied as is. Put it in ~/.config/tidal-player/ and pick
# a theme with `theme = "<name>"` in app.toml, TIDAL_PLAYER_THEME, -t NAME,
# or `T` in the TUI.
#
# The built-in `default` theme (today's look, the terminal's own colours) is
# always first; a theme named `default` here replaces it. What a theme leaves
# out keeps the default look: a palette-only theme changes the background,
# the foreground and the red of errors.

# spotify-player's own look: every component at spotify-player's default.
# The block to copy for it.
[[themes]]
name = "spotify_player"
[themes.component_style]
block_title = { fg = "Magenta" }
border = {}
playback_status = { fg = "Cyan", modifiers = ["Bold"] }
playback_track = { fg = "Cyan", modifiers = ["Bold"] }
playback_artists = { fg = "Cyan", modifiers = ["Bold"] }
playback_album = { fg = "Yellow" }
playback_metadata = { fg = "BrightBlack" }
playback_progress_bar = { fg = "Cyan", bg = "BrightBlack" }
playback_progress_bar_unfilled = { bg = "BrightBlack" }
current_playing = { fg = "Cyan", modifiers = ["Bold"] }
page_desc = { fg = "Cyan", modifiers = ["Bold"] }
playlist_desc = { fg = "BrightBlack", modifiers = ["Dim"] }
table_header = { fg = "Blue" }
selection = { modifiers = ["Reversed", "Bold"] }
secondary_row = {}
like = {}
# This player's own two (spotify-player has neither).
error = { fg = "Red" }
prompt = { modifiers = ["Bold"] }

