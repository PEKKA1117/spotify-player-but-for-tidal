[workspace]
resolver = "3"
members = ["crates/core", "crates/api", "crates/audio", "crates/app", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/PEKKA1117/spotify-player-but-for-tidal"

# Every third-party crate the workspace may use is declared here, so a slice
# only edits its own crate's Cargo.toml (`dep = { workspace = true }`).
[workspace.dependencies]
tidal-player-core = { path = "crates/core" }
tidal-player-api = { path = "crates/api" }
tidal-player-audio = { path = "crates/audio" }

age = "0.12.1"
anyhow = "1.0.104"
alsa = "0.12.1"
assert_cmd = "2.2.2"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
insta = "1.49.0"
keyring = "4.2.0"
predicates = "3.1.4"
ratatui = "0.30.2"
rpassword = "7.5.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = "0.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
webbrowser = "1.2.4"
wiremock = "0.6.5"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
