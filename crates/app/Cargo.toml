[package]
name = "tidal-player"
description = "Terminal Tidal player: standalone, daemon and client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["alsa"]
# ALSA output for `play` (spec 0003); without it `play` exits 1.
alsa = ["tidal-player-audio/alsa"]

[dependencies]
age = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
directories = { workspace = true }
keyring = { workspace = true }
ratatui = { workspace = true }
reqwest = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tidal-player-api = { workspace = true }
tidal-player-audio = { workspace = true }
tidal-player-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
webbrowser = { workspace = true }
zbus = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
assert_cmd = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
